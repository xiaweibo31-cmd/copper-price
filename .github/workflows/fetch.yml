name: 抓取铜价数据
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓取数据
        run: node fetch.js
      - name: 提交数据
        run: |
          git config user.name "铜价机器人"
          git config user.email "bot@copper-price.app"
          git add data/
          git diff --cached --quiet || git commit -m "auto: 更新铜价数据"
          git push
